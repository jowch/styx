name: Eval reference runner

on:
  push:
    branches: [main]
    paths:
      - "eval/**"
      - "Project.toml"
      - ".github/workflows/eval-reference.yml"
  pull_request:
    paths:
      - "eval/**"
      - "Project.toml"
      - ".github/workflows/eval-reference.yml"
  workflow_dispatch:

concurrency:
  group: eval-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Reference runner (4 scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: styx

      - id: pin
        run: echo "rev=$(sed -n 's/^PlutoMCP = .*rev = "\([0-9a-f]*\)".*/\1/p' styx/Project.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: jowch/PlutoMCP.jl
          ref: ${{ steps.pin.outputs.rev }}
          path: PlutoMCP.jl

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - uses: julia-actions/cache@v2

      # EvalShared/run_reference import JSON3; PlutoMCP itself depends on JSON.jl only.
      # A bare PlutoMCP checkout therefore fails with "Package JSON3 not found".
      # Resolve PlutoMCP + JSON3 (+ HTTP/UUIDs) in one env so Parsers versions stay compatible.
      - name: Create combined eval env (PlutoMCP + JSON3 + HTTP)
        run: |
          mkdir -p styx-eval-env
          julia --project="${{ github.workspace }}/styx-eval-env" -e '
            using Pkg
            Pkg.develop(path=joinpath(ENV["GITHUB_WORKSPACE"], "PlutoMCP.jl"))
            Pkg.add(["JSON3", "HTTP", "UUIDs"])
          '

      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: styx-eval-env

      - name: Precompile Pluto stack for serve subprocess
        # Pluto is a PlutoMCP dependency (not a direct dep of the combined env);
        # `using Pluto` here fails with Package Pluto not found.
        run: julia --project=styx-eval-env -e 'using PlutoMCP; using JSON3; using HTTP'

      - name: Run reference scenarios
        working-directory: styx/eval
        env:
          PLUTOMCP_ROOT: ${{ github.workspace }}/styx-eval-env
          JULIA_PRECOMPILE: "0"
          EVAL_HEALTH_TIMEOUT: "180"
        run: julia run_reference.jl --all --strict-trace
